name: Daily Discord Briefing

on:
  schedule:
    # 09:17 Asia/Taipei = 01:17 UTC. Keep this as a GitHub-native backup.
    - cron: "17 1 * * *"
  repository_dispatch:
    types: [daily-discord-briefing]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Show trigger context
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "schedule=${{ github.event.schedule }}"
          echo "dispatch_type=${{ github.event.action }}"
          echo "ref=${{ github.ref }}"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send daily briefing to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/daily_briefing.py